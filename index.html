<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08091b">
    <title>A Little Surprise for Teacher's Day</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f8f5ff;
            --muted: #c7c2da;
            --gold: #ffdc8a;
            --pink: #ff8ccf;
            --blue: #8ceaff;
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 115%, rgba(73, 56, 132, .44), transparent 55%),
                radial-gradient(ellipse at 15% 15%, rgba(28, 53, 102, .38), transparent 42%),
                #08091b;
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button { font: inherit; }

        #fireworks {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: #fff;
            opacity: .45;
            box-shadow: 0 0 9px 2px rgba(185, 208, 255, .6);
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            to { opacity: .12; transform: scale(.55); }
        }

        .circuit {
            position: fixed;
            z-index: 0;
            width: 190px;
            height: 190px;
            border: 1px solid rgba(116, 218, 255, .11);
            border-radius: 28px;
            pointer-events: none;
            opacity: .65;
        }

        .circuit::before,
        .circuit::after {
            position: absolute;
            content: "";
            border: 1px solid rgba(116, 218, 255, .12);
            border-radius: 18px;
        }

        .circuit::before { inset: 16px; }
        .circuit::after { inset: 34px; }
        .circuit-top { top: -105px; right: 9%; transform: rotate(35deg); }
        .circuit-bottom { bottom: -118px; left: 7%; transform: rotate(-25deg); }

        .code-float {
            position: fixed;
            z-index: 0;
            color: rgba(151, 221, 255, .22);
            font: 600 13px/1.8 Consolas, "Courier New", monospace;
            pointer-events: none;
            animation: drift 8s ease-in-out infinite alternate;
        }

        .code-one { top: 22%; left: 5%; }
        .code-two { right: 5%; bottom: 20%; animation-delay: -3s; }

        @keyframes drift {
            to { transform: translateY(-12px); opacity: .55; }
        }

        .screen {
            position: relative;
            z-index: 1;
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 28px 18px;
        }

        .welcome {
            width: min(100%, 650px);
            padding: clamp(32px, 7vw, 66px) 24px;
            text-align: center;
            animation: appear .9s ease both;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--blue);
            font: 600 .76rem/1.4 Consolas, "Courier New", monospace;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .welcome h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            font-weight: 500;
            line-height: 1.12;
            text-wrap: balance;
            text-shadow: 0 0 35px rgba(183, 166, 255, .22);
        }

        .welcome-copy {
            margin: 20px 0 30px;
            color: var(--muted);
            font-size: clamp(.96rem, 2.5vw, 1.08rem);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .button {
            min-height: 50px;
            padding: 13px 22px;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 999px;
            color: var(--ink);
            background: rgba(255, 255, 255, .07);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
        }

        .button:hover { transform: translateY(-2px); }
        .button:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

        .button-primary {
            border-color: rgba(255, 220, 138, .75);
            background: linear-gradient(110deg, rgba(255, 190, 112, .2), rgba(255, 118, 196, .2));
            box-shadow: 0 0 28px rgba(255, 182, 115, .22), inset 0 0 18px rgba(255, 220, 138, .08);
        }

        .button-primary:hover { box-shadow: 0 0 36px rgba(255, 182, 115, .38); }

        .music-status {
            min-height: 1.5em;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: .82rem;
        }

        .celebration {
            display: none;
            width: min(100%, 980px);
            margin: auto;
            padding: 44px 20px 35px;
            text-align: center;
        }

        .celebration.is-visible { display: block; }

        .celebration-inner { animation: appear 1s ease both; }

        .celebration h1 {
            max-width: 920px;
            margin: 0 auto 22px;
            color: var(--gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.25rem, 8vw, 5.7rem);
            font-weight: 700;
            line-height: 1.04;
            text-wrap: balance;
            text-shadow: 0 0 12px rgba(255, 237, 180, .58), 0 0 42px rgba(255, 113, 205, .36);
            animation: title-pop 1.1s cubic-bezier(.2, .85, .25, 1.2) both;
        }

        @keyframes title-pop {
            from { opacity: 0; transform: scale(.7) translateY(22px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .celebration .eyebrow { margin-bottom: 16px; }

        .message {
            max-width: 760px;
            min-height: 1.7em;
            margin: 16px auto;
            color: var(--ink);
            font-size: clamp(1rem, 2.7vw, 1.35rem);
            line-height: 1.7;
            text-wrap: balance;
        }

        .message-special { color: #ffe5f4; }
        .message-final { margin-top: 25px; color: var(--gold); font-weight: 600; }
        .message-signoff { color: var(--pink); font-size: clamp(.98rem, 2.4vw, 1.18rem); }
        .message-thanks { margin-top: 22px; color: var(--blue); font-size: clamp(.78rem, 2.3vw, 1rem); letter-spacing: .1em; }

        .typing {
            opacity: 0;
            transition: opacity .5s ease;
        }

        .typing.is-visible { opacity: 1; }
        .typing.is-typing::after {
            display: inline-block;
            width: 1px;
            height: 1em;
            margin-left: 3px;
            background: currentColor;
            content: "";
            vertical-align: -.12em;
            animation: caret .75s steps(2, start) infinite;
        }

        @keyframes caret { to { visibility: hidden; } }

        .celebration-actions { margin-top: 27px; }
        .footer-note { margin: 24px 0 0; color: rgba(226, 221, 242, .6); font-size: .76rem; }

        .confetti {
            position: fixed;
            z-index: 2;
            top: -14px;
            width: 8px;
            height: 13px;
            border-radius: 2px;
            pointer-events: none;
            animation: confetti-fall var(--fall-duration, 5s) linear forwards;
        }

        @keyframes confetti-fall {
            to { transform: translate3d(var(--drift, 40px), 110vh, 0) rotate(760deg); opacity: .15; }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 540px) {
            .screen { padding: 18px 14px; }
            .celebration { padding: 30px 8px; }
            .button { width: 100%; max-width: 310px; }
            .code-float { font-size: 10px; opacity: .7; }
            .code-one { left: 3%; top: 12%; }
            .code-two { right: 3%; bottom: 9%; }
            .circuit { width: 140px; height: 140px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <div class="ambient" id="stars" aria-hidden="true"></div>
    <div class="circuit circuit-top" aria-hidden="true"></div>
    <div class="circuit circuit-bottom" aria-hidden="true"></div>
    <div class="code-float code-one" aria-hidden="true">{ kindness: true }<br>&lt;/&gt; inspire();</div>
    <div class="code-float code-two" aria-hidden="true">while (learning) {<br>&nbsp;&nbsp;grow(); 💻<br>}</div>

    <main class="screen">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
            <p class="eyebrow">A little something from your students</p>
            <h1 id="welcome-title">You have a special message… 🎁</h1>
            <p class="welcome-copy">A tiny surprise is waiting just for you.</p>
            <div class="actions">
                <button class="button button-primary" id="open-surprise" type="button">Click to Open Surprise</button>
                <button class="button music-button" type="button" aria-pressed="false">Play Celebration Music 🎵</button>
            </div>
            <p class="music-status" id="music-status" role="status" aria-live="polite"></p>
        </section>

        <section class="celebration" id="celebration" aria-labelledby="main-title" aria-hidden="true">
            <div class="celebration-inner">
                <p class="eyebrow">A celebration for the ones who make us shine</p>
                <h1 id="main-title">HAPPY WORLD TEACHERS’ DAY! 👩‍🏫👨‍🏫🎉</h1>
                <p class="message typing" data-message="To all the amazing teachers who inspire, guide, and believe in their students — THANK YOU!"></p>
                <p class="message message-special typing" data-message="Especially to our amazing IT Instructor — thank you for sharing your knowledge, patience, and passion with us. 💻❤️"></p>
                <p class="message message-final typing" data-message="Happy Teacher’s Day, Sir/Ma’am! 🎓💻✨"></p>
                <p class="message message-signoff typing" data-message="From your students who appreciate everything you do. ❤️"></p>
                <p class="message message-thanks typing" data-message="THANK YOU FOR TEACHING US MORE THAN JUST TECHNOLOGY."></p>
                <div class="actions celebration-actions">
                    <button class="button music-button" type="button" aria-pressed="false">Play Celebration Music 🎵</button>
                </div>
                <p class="music-status" role="status" aria-live="polite"></p>
                <p class="footer-note">{ Thank you Teachers!! } &nbsp; &lt;/&gt; &nbsp; 💻</p>
            </div>
        </section>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById("fireworks");
            const context = canvas.getContext("2d");
            const stars = document.getElementById("stars");
            const welcome = document.getElementById("welcome");
            const celebration = document.getElementById("celebration");
            const openButton = document.getElementById("open-surprise");
            const musicButtons = document.querySelectorAll(".music-button");
            const musicStatuses = document.querySelectorAll(".music-status");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const colors = ["#ffd166", "#ff70b7", "#79e7ff", "#b59bff", "#9dffb0", "#ff8b6a"];
            const particles = [];
            let width = 0;
            let height = 0;
            let pixelRatio = 1;
            let isRevealed = false;
            let audioContext = null;
            let musicTimer = null;
            let noteIndex = 0;

            function makeStars() {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 75; i += 1) {
                    const star = document.createElement("span");
                    star.className = "star";
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    star.style.setProperty("--duration", `${2 + Math.random() * 4}s`);
                    star.style.animationDelay = `${Math.random() * -5}s`;
                    fragment.appendChild(star);
                }
                stars.appendChild(fragment);
            }

            function resizeCanvas() {
                pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.round(width * pixelRatio);
                canvas.height = Math.round(height * pixelRatio);
                context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            }

            function burst(x, y, power = 1) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = Math.round((38 + Math.random() * 32) * power);
                for (let i = 0; i < count; i += 1) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = (1.1 + Math.random() * 4.3) * power;
                    particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 48 + Math.random() * 42,
                        maxLife: 90,
                        size: 1.2 + Math.random() * 2.2,
                        color
                    });
                }
            }

            function animateFireworks() {
                context.clearRect(0, 0, width, height);
                for (let i = particles.length - 1; i >= 0; i -= 1) {
                    const particle = particles[i];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.035;
                    particle.vx *= 0.992;
                    particle.vy *= 0.992;
                    particle.life -= 1;

                    if (particle.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    context.globalAlpha = Math.min(1, particle.life / 20);
                    context.fillStyle = particle.color;
                    context.shadowBlur = 12;
                    context.shadowColor = particle.color;
                    context.beginPath();
                    context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    context.fill();
                }
                context.globalAlpha = 1;
                context.shadowBlur = 0;
                window.requestAnimationFrame(animateFireworks);
            }

            function launchFireworks() {
                const launch = () => {
                    if (!isRevealed) return;
                    burst(width * (.14 + Math.random() * .72), height * (.12 + Math.random() * .53), .75 + Math.random() * .45);
                    window.setTimeout(launch, 450 + Math.random() * 650);
                };
                burst(width * .5, height * .35, 1.3);
                window.setTimeout(launch, 400);
            }

            function showerConfetti() {
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 85; i += 1) {
                    const piece = document.createElement("span");
                    piece.className = "confetti";
                    piece.style.left = `${Math.random() * 100}%`;
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.setProperty("--fall-duration", `${3.5 + Math.random() * 4}s`);
                    piece.style.setProperty("--drift", `${Math.round(Math.random() * 160 - 80)}px`);
                    piece.style.animationDelay = `${Math.random() * 2.5}s`;
                    fragment.appendChild(piece);
                    window.setTimeout(() => piece.remove(), 8000);
                }
                document.body.appendChild(fragment);
            }

            function typeMessages() {
                const messages = [...celebration.querySelectorAll("[data-message]")];
                let index = 0;

                function typeNext() {
                    if (index >= messages.length) return;
                    const element = messages[index];
                    const characters = Array.from(element.dataset.message);
                    let characterIndex = 0;
                    element.classList.add("is-visible", "is-typing");

                    function typeCharacter() {
                        element.textContent += characters[characterIndex];
                        characterIndex += 1;
                        if (characterIndex < characters.length) {
                            window.setTimeout(typeCharacter, reducedMotion ? 0 : 25);
                        } else {
                            element.classList.remove("is-typing");
                            index += 1;
                            window.setTimeout(typeNext, reducedMotion ? 100 : 380);
                        }
                    }

                    typeCharacter();
                }

                window.setTimeout(typeNext, reducedMotion ? 0 : 550);
            }

            function revealSurprise() {
                if (isRevealed) return;
                isRevealed = true;
                welcome.hidden = true;
                celebration.classList.add("is-visible");
                celebration.setAttribute("aria-hidden", "false");
                launchFireworks();
                showerConfetti();
                typeMessages();
            }

            function updateMusicStatus(message) {
                musicStatuses.forEach((status) => { status.textContent = message; });
            }

            function playNote() {
                const notes = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46];
                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.type = "sine";
                oscillator.frequency.value = notes[noteIndex % notes.length];
                noteIndex += 1;
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.12, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start(now);
                oscillator.stop(now + 0.44);
            }

            async function toggleMusic() {
                if (musicTimer !== null) {
                    window.clearInterval(musicTimer);
                    musicTimer = null;
                    await audioContext.close();
                    audioContext = null;
                    musicButtons.forEach((button) => {
                        button.textContent = "Play Celebration Music 🎵";
                        button.setAttribute("aria-pressed", "false");
                    });
                    updateMusicStatus("Music paused.");
                    return;
                }

                const AudioContextType = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextType) {
                    updateMusicStatus("Celebration music is not supported by this browser.");
                    return;
                }

                try {
                    audioContext = new AudioContextType();
                    await audioContext.resume();
                    playNote();
                    musicTimer = window.setInterval(playNote, 440);
                    musicButtons.forEach((button) => {
                        button.textContent = "Pause Celebration Music";
                        button.setAttribute("aria-pressed", "true");
                    });
                    updateMusicStatus("A little celebration tune is playing.");
                } catch (error) {
                    if (audioContext && audioContext.state !== "closed") await audioContext.close();
                    audioContext = null;
                    updateMusicStatus("Music could not start. Please try again using the button.");
                    console.error("Unable to start celebration music.", error);
                }
            }

            makeStars();
            resizeCanvas();
            animateFireworks();
            window.addEventListener("resize", resizeCanvas);
            openButton.addEventListener("click", revealSurprise);
            musicButtons.forEach((button) => button.addEventListener("click", toggleMusic));
        })();
    </script>
</body>
</html>
